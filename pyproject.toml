[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mvr-api-client"
version = "6.32.4"
description = "Python client for the MVR API relational-readiness layer"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

authors = [
  { name = "African Market OS", email = "info@africanmarketos.com" }
]

keywords = [
  "mvr",
  "api",
  "minimum-viable-relationships",
  "relational-readiness",
  "market-permission",
  "mcp",
  "openapi",
  "ai-agents",
  "african-market",
  "emerging-markets"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

dependencies = [
  "requests>=2.25.0",
  "pydantic>=1.8,<3.0"
]

[project.optional-dependencies]
dev = [
  "build>=1.2.0",
  "mypy>=1.11.0,<1.18"
]

[project.urls]
Homepage = "https://github.com/africanmarketos591/mvr-api-py-client"
Repository = "https://github.com/africanmarketos591/mvr-api-py-client"
Issues = "https://github.com/africanmarketos591/mvr-api-py-client/issues"
Documentation = "https://africanmarketos.com/AGENTS.md"
OpenAPI = "https://africanmarketos.com/api/openapi.agent.json"
MCP = "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.africanmarketos591%2Fmvr-api"

[tool.setuptools.packages.find]
where = ["."]
include = ["mvr_api*"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true

